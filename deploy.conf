# deploy.conf — sourced by deploy.sh
# One file per environment — committed to repo, secrets via env vars.

# ── registry ──────────────────────────────────────────────────────────
REGISTRY="docker.io/DOCKER_USERNAME"
IMAGE_NAME="REQUIRED_NAME"

# ── service ───────────────────────────────────────────────────────────
SERVICE_NAME="REQUIRED_NAME-api"
CONTAINER_NAME="REQUIRED_NAME-api"
CONTAINER_PORT=8000
HOST_PORT=8000

# ── health check ──────────────────────────────────────────────────────
HEALTH_ENDPOINT="http://localhost:${HOST_PORT}/health"
HEALTH_TIMEOUT=60          # seconds to wait for health check to pass
HEALTH_INTERVAL=3          # seconds between each health check poll
HEALTH_CONSECUTIVE=3       # consecutive 200s required to declare success

# ── rollback ──────────────────────────────────────────────────────────
ROLLBACK_FILE="/tmp/deploy_rollback_${SERVICE_NAME}"

# ── notifications (set to empty string to skip) ────────────────────────
SLACK_WEBHOOK=""           # https://hooks.slack.com/services/...
NOTIFY_EMAIL=""            # ops@yourcompany.com

# ── environment-specific overrides (loaded after this file) ───────────
# prod:    /etc/deploy/prod.conf
# staging: /etc/deploy/staging.conf
# dev:     ~/.config/deploy/dev.conf
